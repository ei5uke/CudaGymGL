<svg xmlns="http://www.w3.org/2000/svg" width="720" height="215" viewBox="0 0 720 215" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="720" height="215" rx="14" fill="#ffffff"/>

  <!-- Today -->
  <text x="30" y="38" font-size="19" font-weight="bold" fill="#223">Today: simulation and training live on different chips</text>
  <rect x="40" y="60" width="220" height="110" rx="12" fill="#dbe7fb" stroke="#3b6fc4" stroke-width="2"/>
  <text x="150" y="92" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d3b6e">CPU</text>
  <rect x="65" y="108" width="170" height="44" rx="8" fill="#fde5cf" stroke="#d9782b"/>
  <text x="150" y="135" text-anchor="middle" font-size="15" fill="#7a3d0b">Simulation</text>
  <rect x="460" y="60" width="220" height="110" rx="12" fill="#d6f0e3" stroke="#2f9e6e" stroke-width="2"/>
  <text x="570" y="92" text-anchor="middle" font-size="18" font-weight="bold" fill="#17553a">GPU</text>
  <rect x="485" y="108" width="170" height="44" rx="8" fill="#ffffff" stroke="#2f9e6e"/>
  <text x="570" y="135" text-anchor="middle" font-size="15" fill="#17553a">Training (AI model)</text>
  <line x1="268" y1="98" x2="450" y2="98" stroke="#c0392b" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#ar)"/>
  <text x="360" y="88" text-anchor="middle" font-size="13" fill="#c0392b">results (copied)</text>
  <line x1="452" y1="138" x2="270" y2="138" stroke="#c0392b" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#ar)"/>
  <text x="360" y="158" text-anchor="middle" font-size="13" fill="#c0392b">actions (copied)</text>
  <text x="360" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">Data crosses between chips every step, millions of times. Slow.</text>

</svg>
